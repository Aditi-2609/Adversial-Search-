services:
  simulator:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      SIMULATOR_DB_PATH: /data/simulator.db
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      LOG_LEVEL: INFO
    volumes:
      - simulator_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  simulator_data:
