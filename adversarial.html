<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Adversarial Search</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/simulator.css"><link rel="stylesheet" href="css/responsive.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark"><i class="fa-solid fa-brain"></i></span>AI Simulator</div><nav class="nav"><a href="index.html"><i class="fa-solid fa-house"></i>Home</a><a class="active" href="adversarial.html"><i class="fa-solid fa-chess"></i>Adversarial Search</a></nav></aside>
<main class="main"><div class="topbar"><div><button class="btn secondary mobile-menu" type="button" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button><h1>Adversarial Search</h1><div class="subtitle">Tic-Tac-Toe · Human vs AI</div></div></div><div class="grid grid-2"><div class="card"><div class="board" id="board" aria-label="Tic-Tac-Toe board"></div><div style="text-align:center;margin-top:16px"><button class="btn secondary" id="reset" type="button">Reset Game</button><button class="btn" id="aiTurn" type="button">Run AI Turn</button></div></div><div class="card"><div class="form-row"><label>Algorithm<select id="algorithm"><option value="alpha-beta">Alpha-Beta Pruning</option><option value="minimax">Minimax</option></select></label><label>Search Depth<input id="depth" type="number" min="1" max="9" value="7"></label></div><div class="metric-row"><span>Best move</span><b id="best">—</b></div><div class="metric-row"><span>Evaluated nodes</span><b id="nodes">—</b></div><div class="metric-row"><span>Pruned branches</span><b id="pruned">—</b></div><div class="metric-row"><span>Execution time</span><b id="time">—</b></div><div id="gameNotice" class="notice hidden" role="status" aria-live="polite"></div></div></div><div class="card" style="margin-top:16px"><h3>Root Move Evaluations</h3><p class="muted">Each displayed move and score is returned by the selected search algorithm.</p><div id="tree" class="move-evaluations" aria-live="polite">Make a move or run the AI to evaluate legal moves.</div></div></main></div><script src="js/api.js"></script><script src="js/main.js"></script><script src="js/adversarial.js"></script></body></html>
